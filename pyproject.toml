[project]
name = "spatial-moe-for-adverse-weather-salient-object-detection"
version = "0.1.0"
description = "Spatially Dynamic Mixture-of-Experts for Adverse-Weather Salient Object Detection"
readme = "README.md"
authors = [
    { name = "AviBapatu", email = "avinashreddybapatu2006@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "albumentations==2.0.8",
    "fastapi==0.141.1",
    "huggingface_hub==1.28.0",
    "matplotlib==3.11.1",
    "numpy==1.26.4",
    "opencv-python==4.11.0.86",
    "pysodmetrics==1.6.2",
    "python-dotenv==1.2.3",
    "python-multipart==0.0.32",
    "scikit-learn==1.9.0",
    "tensorboard==2.21.0",
    "timm==1.0.28",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "tqdm==4.70.0",
    "uvicorn==0.52.4",
]

[tool.pyright]
extraPaths = ["."]
executionEnvironments = [{ root = "." }]
include = ["."]
venvPath = "."
venv = ".venv"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.12.2",
]

[tool.pytest.ini_options]
pythonpath = "."
markers = [
    "gpu: test requires CUDA; skipped on CPU-only runners (see tests/conftest.py)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# cv2.setNumThreads(0) must run before `import albumentations` to prevent the
# cv2 thread pool from competing with DataLoader workers (see src/dataset.py).
"src/dataset.py" = ["E402"]
# sys.path insertion must precede the src.* imports that depend on it.
"src/training/cli.py" = ["E402"]